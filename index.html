<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EA">
<title>八诗八景 · 沈约的诗词世界</title>
<style>
/* ============ 设计令牌：清爽现代的宣纸宋韵 ============ */
:root{
  --paper:#F6F3EA; --paper-2:#FBF9F2; --card:#FFFFFF;
  --ink:#2B2B27; --ink-2:#5C5B52; --ink-3:#93917F;
  --line:#EAE4D4; --line-2:#F1ECDD;
  --jade:#4F7D5C; --jade-2:#3F6650; --jade-soft:#E7F0E8;
  --water:#4E828A; --water-soft:#E4EFF0;
  --gold:#B98B3E; --gold-2:#CBA25C; --gold-soft:#F4EAD5;
  --moon:#7C89A6; --moon-soft:#EAECF4;
  --snow:#6E7A93; --snow-soft:#ECEEF5;
  --rose:#B45B54; --rose-soft:#F6E6E4;
  --shadow:0 6px 22px rgba(60,58,45,.10);
  --shadow-lg:0 18px 48px rgba(60,58,45,.20);
  --r:18px; --r-sm:12px; --r-lg:26px;
  --title:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","STSong","SimSun",serif;
  --body:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;}
body{font-family:var(--body);color:var(--ink);background:
  radial-gradient(1200px 600px at 20% -10%, #EFEADF 0%, transparent 60%),
  radial-gradient(1000px 500px at 120% 10%, #E6EEE6 0%, transparent 55%),
  linear-gradient(160deg,#F3EFE4,#EAF0EC);
  display:flex;align-items:center;justify-content:center;min-height:100%;}
::selection{background:var(--gold-soft);}

/* ============ 手机外壳 ============ */
.stage{padding:22px;}
.phone{position:relative;width:400px;height:842px;max-height:calc(100vh - 44px);
  background:var(--paper);border-radius:46px;padding:11px;
  box-shadow:var(--shadow-lg),0 0 0 2px #fff inset;
  border:1px solid #e4ddca;}
.phone-inner{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;
  background:var(--paper);display:flex;flex-direction:column;}
@media (max-width:460px){
  body{background:var(--paper);}
  .stage{padding:0;}
  .phone{width:100vw;height:100vh;height:100dvh;max-height:none;border-radius:0;padding:0;border:0;box-shadow:none;}
  .phone-inner{border-radius:0;}
}

/* status bar */
.statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px 0 26px;font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.5px;}
.statusbar .sicons{display:flex;align-items:center;gap:6px;}
.statusbar svg{display:block;}
/* app bar */
.appbar{flex:none;height:52px;display:flex;align-items:center;gap:8px;padding:0 14px 0 12px;position:relative;}
.appbar .ab-title{font-family:var(--title);font-size:18px;font-weight:700;letter-spacing:1px;}
.appbar .ab-back{width:34px;height:34px;border-radius:50%;border:0;background:transparent;display:none;
  align-items:center;justify-content:center;cursor:pointer;color:var(--ink);font-size:20px;}
.appbar .ab-back.show{display:flex;}
.capsule{margin-left:auto;width:88px;height:32px;border-radius:16px;background:rgba(255,255,255,.72);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:0;color:var(--ink-2);}
.capsule .cp{flex:1;display:flex;align-items:center;justify-content:center;font-size:15px;}
.capsule .cp+.cp{border-left:1px solid var(--line);}

/* screens / scroll */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative;scroll-behavior:smooth;}
.scroll::-webkit-scrollbar{width:0;}
.page{display:none;animation:fade .32s ease;padding:0 16px 120px;}
.page.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ============ 通用组件 ============ */
.sec{margin-top:22px;}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 12px;}
.sec-h .t{font-family:var(--title);font-size:18px;font-weight:700;letter-spacing:1px;}
.sec-h .t small{font-size:11px;color:var(--ink-3);font-weight:400;letter-spacing:2px;margin-left:8px;font-family:var(--body);}
.sec-h .more{font-size:12px;color:var(--jade);cursor:pointer;font-weight:600;}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line-2);}
.pad{padding:16px;}
.tag{display:inline-flex;align-items:center;font-size:11px;padding:3px 9px;border-radius:999px;
  background:var(--jade-soft);color:var(--jade-2);font-weight:600;letter-spacing:.5px;}
.tag.gold{background:var(--gold-soft);color:#8a6a2f;}
.tag.water{background:var(--water-soft);color:var(--water);}
.tag.moon{background:var(--moon-soft);color:#566184;}
.tag.rose{background:var(--rose-soft);color:var(--rose);}
.btn{border:0;border-radius:999px;font-family:var(--body);font-weight:600;cursor:pointer;transition:.18s;font-size:14px;}
.btn:active{transform:scale(.97);}
.btn-p{background:linear-gradient(135deg,var(--jade),var(--jade-2));color:#fff;padding:12px 20px;box-shadow:0 6px 16px rgba(79,125,92,.32);}
.btn-g{background:#fff;color:var(--jade-2);border:1px solid var(--jade);padding:11px 18px;}
.btn-gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#fff;padding:12px 20px;box-shadow:0 6px 16px rgba(185,139,62,.3);}
.btn-sm{padding:8px 14px;font-size:12.5px;}
.btn-block{width:100%;}
.icon-btn{width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--line-2);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
.divider{height:1px;background:var(--line);margin:14px 0;}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:.15s;font-weight:500;}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;}
.hscroll::-webkit-scrollbar{height:0;}
.pill-row{display:flex;gap:8px;}

/* ============ 首页 ============ */
.hero{position:relative;margin:6px -16px 0;padding:30px 20px 78px;color:#fff;overflow:hidden;
  background:linear-gradient(150deg,#2F4A3A 0%,#3F6650 42%,#4E828A 100%);}
.hero::after{content:"";position:absolute;inset:0;background:
  radial-gradient(420px 200px at 88% -12%, rgba(203,162,92,.55), transparent 60%),
  radial-gradient(360px 220px at -8% 112%, rgba(255,255,255,.16), transparent 60%);}
.hero .h-kicker{font-size:12px;letter-spacing:6px;opacity:.85;font-family:var(--body);position:relative;z-index:2;}
.hero h1{font-family:var(--title);font-size:34px;margin:8px 0 4px;letter-spacing:5px;position:relative;z-index:2;font-weight:700;}
.hero .h-sub{font-size:13px;letter-spacing:3px;opacity:.9;position:relative;z-index:2;}
.hero .h-verse{margin-top:16px;font-family:var(--title);font-size:14px;line-height:1.9;opacity:.92;position:relative;z-index:2;
  border-left:2px solid rgba(255,255,255,.5);padding-left:12px;}
.hero .h-deco{position:absolute;right:-10px;top:10px;opacity:.16;z-index:1;}
.hero .h-deco text{fill:#fff;font-family:var(--title);font-size:120px;writing-mode:vertical-rl;letter-spacing:8px;}
.quick{position:relative;z-index:3;margin:-52px 0 0;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 6px;}
.quick .q{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;}
.quick .q .qi{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:.2s;}
.quick .q:active .qi{transform:scale(.9);}
.quick .q span{font-size:11.5px;color:var(--ink-2);font-weight:500;}
.qi.a{background:var(--jade-soft);color:var(--jade-2);} .qi.b{background:var(--water-soft);color:var(--water);}
.qi.c{background:var(--gold-soft);color:#8a6a2f;} .qi.d{background:var(--moon-soft);color:#566184;} .qi.e{background:var(--rose-soft);color:var(--rose);}

.prog{margin-top:16px;background:linear-gradient(135deg,#fff,#FBF9F2);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line-2);}
.prog .pr-top{display:flex;align-items:center;justify-content:space-between;}
.prog .pr-top .lbl{font-family:var(--title);font-size:16px;font-weight:700;}
.prog .pr-top .num{font-size:13px;color:var(--ink-3);} .prog .pr-top .num b{color:var(--jade);font-size:18px;font-family:var(--title);}
.bar{height:10px;border-radius:999px;background:var(--line-2);margin:12px 0 8px;overflow:hidden;}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--jade),var(--gold-2));transition:width .5s;}
.prog .seals{display:flex;gap:6px;margin-top:10px;}
.prog .seals .s{flex:1;aspect-ratio:1;border-radius:9px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--title);font-size:13px;color:var(--ink-3);}
.prog .seals .s.done{border:1.5px solid var(--rose);color:var(--rose);background:var(--rose-soft);box-shadow:0 0 0 2px rgba(180,91,84,.08);}

.season{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;}
.season::-webkit-scrollbar{height:0;}
.scard{flex:none;width:150px;border-radius:var(--r);overflow:hidden;color:#fff;position:relative;box-shadow:var(--shadow);cursor:pointer;}
.scard .sc-bg{height:98px;display:flex;align-items:center;justify-content:center;font-family:var(--title);font-size:44px;font-weight:700;opacity:.9;}
.scard .sc-body{padding:10px 12px;background:rgba(0,0,0,.14);}
.scard .sc-body .n{font-size:14px;font-weight:700;font-family:var(--title);}
.scard .sc-body .d{font-size:11px;opacity:.85;margin-top:2px;}
.sc-spring{background:linear-gradient(150deg,#7CA36B,#4F7D5C);} .sc-summer{background:linear-gradient(150deg,#4E828A,#2F514B);}
.sc-autumn{background:linear-gradient(150deg,#CBA25C,#9C7B46);} .sc-winter{background:linear-gradient(150deg,#8892AB,#5B6884);}

/* ============ 手绘地图 ============ */
.map-wrap{background:linear-gradient(160deg,#FBF9F2,#F0EEDF);border-radius:var(--r-lg);padding:8px;box-shadow:var(--shadow);border:1px solid var(--line-2);position:relative;overflow:hidden;}
.map-wrap svg{display:block;width:100%;height:auto;}
.node{cursor:pointer;}
.node circle.hit{fill:transparent;}
.node .dot{transition:.2s;}
.node.active .dot{r:20;}
.node text{font-family:var(--title);pointer-events:none;}
.route-info{margin-top:14px;}
.rt-line{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line);}
.rt-line:last-child{border:0;}
.rt-line .rk{flex:none;width:26px;height:26px;border-radius:50%;background:var(--jade);color:#fff;font-family:var(--title);display:flex;align-items:center;justify-content:center;font-size:13px;}
.rt-line .rt{font-size:13px;color:var(--ink-2);line-height:1.7;} .rt-line .rt b{color:var(--ink);font-family:var(--title);font-size:14px;}

/* ============ 卡片网格 ============ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.zcard{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;border:1px solid var(--line-2);transition:.2s;}
.zcard:active{transform:translateY(2px);}
.zcard .zc-top{height:92px;display:flex;align-items:center;justify-content:center;position:relative;}
.zcard .zc-top svg{width:44px;height:44px;}
.zcard .zc-no{position:absolute;left:10px;top:8px;font-family:var(--title);font-size:12px;color:#fff;background:rgba(0,0,0,.18);padding:2px 8px;border-radius:999px;}
.zcard .zc-body{padding:11px 12px 13px;}
.zcard .zc-body .n{font-family:var(--title);font-size:15px;font-weight:700;}
.zcard .zc-body .k{font-size:11.5px;color:var(--jade-2);margin-top:3px;font-weight:600;}
.zcard .zc-body .v{font-size:11px;color:var(--ink-3);margin-top:5px;line-height:1.5;}

/* ============ AR ============ */
.ar-scan{background:radial-gradient(140px 90px at 50% 30%, rgba(78,130,138,.28), transparent),linear-gradient(160deg,#26332C,#33463D);
  border-radius:var(--r-lg);padding:26px;text-align:center;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow);}
.ar-frame{width:170px;height:170px;margin:6px auto 16px;position:relative;border-radius:16px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;}
.ar-frame .corner{position:absolute;width:26px;height:26px;border:3px solid var(--gold-2);border-radius:4px;}
.ar-frame .c1{left:-1px;top:-1px;border-right:0;border-bottom:0;} .ar-frame .c2{right:-1px;top:-1px;border-left:0;border-bottom:0;}
.ar-frame .c3{left:-1px;bottom:-1px;border-right:0;border-top:0;} .ar-frame .c4{right:-1px;bottom:-1px;border-left:0;border-top:0;}
.ar-scanline{position:absolute;left:10px;right:10px;height:2px;background:linear-gradient(90deg,transparent,#7fe3c4,transparent);
  box-shadow:0 0 12px #7fe3c4;animation:scan 2.2s ease-in-out infinite;}
@keyframes scan{0%{top:12px;}50%{top:150px;}100%{top:12px;}}
.ar-fig{font-family:var(--title);font-size:40px;color:#cfeee0;opacity:.9;}
.ar-verse{font-family:var(--title);font-size:19px;line-height:2;margin:14px auto;max-width:260px;color:#f0e6cf;min-height:40px;}
.ar-verse .cursor{color:var(--gold-2);}

/* ============ AIGC ============ */
.tabs{display:flex;background:var(--line-2);border-radius:999px;padding:4px;gap:4px;}
.tabs .tb{flex:1;text-align:center;padding:9px;border-radius:999px;font-size:13px;color:var(--ink-2);cursor:pointer;font-weight:600;transition:.2s;}
.tabs .tb.on{background:#fff;color:var(--jade-2);box-shadow:var(--shadow);}
textarea.inp{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;font-family:var(--body);font-size:14px;resize:none;height:88px;background:var(--paper-2);color:var(--ink);}
textarea.inp:focus{outline:0;border-color:var(--jade);}
.poem-out{background:linear-gradient(160deg,#fff,#FBF8EF);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;margin-top:14px;text-align:center;position:relative;}
.poem-out::before{content:"";position:absolute;inset:8px;border:1px solid var(--gold-soft);border-radius:12px;pointer-events:none;}
.poem-out .pt{font-family:var(--title);font-size:15px;color:var(--gold);letter-spacing:3px;margin-bottom:12px;}
.poem-out .pl{font-family:var(--title);font-size:17px;line-height:2.1;color:var(--ink);letter-spacing:2px;}
.typing .pl span{opacity:0;animation:pop .4s forwards;}
@keyframes pop{to{opacity:1;}}

/* ============ 商城 ============ */
.goods{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line-2);}
.goods .g-cover{height:110px;display:flex;align-items:center;justify-content:center;position:relative;font-family:var(--title);color:#fff;font-size:15px;letter-spacing:2px;}
.goods .g-body{padding:10px 11px 12px;}
.goods .g-name{font-size:13.5px;font-weight:600;}
.goods .g-desc{font-size:11px;color:var(--ink-3);margin:4px 0 8px;line-height:1.5;min-height:32px;}
.goods .g-foot{display:flex;align-items:center;justify-content:space-between;}
.goods .price{color:var(--rose);font-weight:700;font-family:var(--title);} .goods .price small{font-size:10px;}
.add{width:28px;height:28px;border-radius:50%;background:var(--jade);color:#fff;border:0;font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(79,125,92,.4);}
.add:active{transform:scale(.9);}

/* ============ 列表单元 ============ */
.cell{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line-2);cursor:pointer;}
.cell:last-child{border:0;}
.cell .ci{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--jade-soft);color:var(--jade-2);}
.cell .ct{flex:1;} .cell .ct .a{font-size:14.5px;font-weight:600;} .cell .ct .b{font-size:11.5px;color:var(--ink-3);margin-top:2px;}
.cell .cv{font-size:12.5px;color:var(--ink-3);} .cell .arr{color:var(--ink-3);}

/* ============ 底部 tab ============ */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:74px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;padding:8px 6px 22px;z-index:40;}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--ink-3);transition:.15s;}
.tabbar .tab svg{width:24px;height:24px;}
.tabbar .tab span{font-size:10.5px;font-weight:600;}
.tabbar .tab.on{color:var(--jade);}
.tabbar .tab.on .tb-home{transform:translateY(-2px);}
.tabbar .tab .tb-home{transition:.2s;}

/* ============ 详情 overlay ============ */
.overlay{position:absolute;inset:0;background:var(--paper);z-index:60;transform:translateX(100%);transition:transform .34s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
.overlay.show{transform:none;}
.ov-bar{flex:none;height:52px;display:flex;align-items:center;gap:8px;padding:0 14px;background:rgba(246,243,234,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.ov-bar .ob-back{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;border:1px solid var(--line);}
.ov-bar .ob-t{font-family:var(--title);font-size:17px;font-weight:700;}
.ov-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;} .ov-scroll::-webkit-scrollbar{width:0;}
.ov-body{padding:0 16px 40px;}
.ov-hero{margin:0 -16px 0;padding:34px 20px 22px;color:#fff;position:relative;overflow:hidden;}
.ov-hero .no{font-family:var(--title);font-size:13px;letter-spacing:4px;opacity:.85;}
.ov-hero h2{font-family:var(--title);font-size:26px;margin:6px 0 4px;letter-spacing:3px;}
.ov-hero .kw{font-size:13px;letter-spacing:2px;opacity:.92;}
.ov-hero .verse{font-family:var(--title);margin-top:14px;font-size:15px;opacity:.95;border-left:2px solid rgba(255,255,255,.5);padding-left:12px;line-height:1.9;}
.ov-hero svg.bigart{position:absolute;right:14px;bottom:10px;width:78px;height:78px;opacity:.16;}
.link{background:linear-gradient(150deg,#FFF7E9,#FBEFD8);border:1px solid var(--gold-soft);border-radius:var(--r);padding:14px;margin-top:14px;}
.link .lk-h{display:flex;align-items:center;gap:8px;font-family:var(--title);font-weight:700;color:#8a6a2f;font-size:15px;}
.link .lk-i{font-size:12px;color:#8a6a2f;line-height:1.7;} .link ul{margin:8px 0 0;padding-left:18px;} .link li{font-size:12.5px;color:var(--ink-2);line-height:1.85;}
.ov-h{font-family:var(--title);font-size:16px;font-weight:700;margin:20px 0 8px;display:flex;align-items:center;gap:8px;}
.ov-h::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--jade);}
.li-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;color:var(--ink-2);line-height:1.6;}
.li-item .lb{color:var(--gold);font-weight:700;flex:none;}
.exp-item{display:flex;gap:8px;padding:8px 0;font-size:13px;color:var(--ink-2);line-height:1.6;}
.exp-item::before{content:"◦";color:var(--jade);font-weight:700;}
.ov-foot{flex:none;background:rgba(246,243,234,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;}

/* ============ toast / sheet / cart ============ */
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:rgba(43,43,39,.94);
  color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.28s;z-index:90;white-space:nowrap;box-shadow:var(--shadow-lg);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.sheet-mask{position:absolute;inset:0;background:rgba(30,30,25,.35);opacity:0;pointer-events:none;transition:.25s;z-index:70;}
.sheet-mask.show{opacity:1;pointer-events:auto;}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:24px 24px 0 0;z-index:75;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:72%;display:flex;flex-direction:column;}
.sheet.show{transform:none;}
.sheet .sh-h{padding:16px 18px 8px;display:flex;align-items:center;justify-content:space-between;}
.sheet .sh-h .s{font-family:var(--title);font-size:17px;font-weight:700;}
.sheet .sh-b{overflow-y:auto;padding:0 18px 18px;} .sheet .sh-b::-webkit-scrollbar{width:0;}
.cart-line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);}
.cart-line .cl-n{flex:1;font-size:14px;} .cart-line .cl-p{color:var(--rose);font-weight:600;font-size:14px;}
.stepper{display:flex;align-items:center;gap:10px;} .stepper button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;color:var(--ink);}
.cart-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line);}
.cart-bar .tot{font-size:14px;} .cart-bar .tot b{color:var(--rose);font-family:var(--title);font-size:20px;}
.empty{text-align:center;padding:40px 20px;color:var(--ink-3);} .empty svg{opacity:.4;margin-bottom:10px;}
.field{margin-bottom:12px;} .field label{font-size:12.5px;color:var(--ink-2);font-weight:600;display:block;margin-bottom:6px;}
.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:14px;background:var(--paper-2);color:var(--ink);font-family:var(--body);}
.field input:focus,.field select:focus{outline:0;border-color:var(--jade);}
.wish{display:flex;flex-wrap:wrap;gap:8px;}
.wish .w{background:linear-gradient(135deg,#fff,#FBF6EA);border:1px solid var(--gold-soft);border-radius:12px;padding:9px 13px;font-size:13px;color:#8a6a2f;font-family:var(--title);}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;}
.stat3 .st{padding:12px 4px;background:var(--paper-2);border-radius:var(--r-sm);} .stat3 .st b{display:block;font-family:var(--title);font-size:20px;color:var(--jade-2);} .stat3 .st span{font-size:11px;color:var(--ink-3);}
.mine-hero{background:linear-gradient(140deg,#3F6650,#4E828A);border-radius:var(--r-lg);padding:20px;color:#fff;display:flex;align-items:center;gap:14px;margin-top:8px;box-shadow:var(--shadow);}
.mine-hero .av{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-family:var(--title);font-size:24px;border:2px solid rgba(255,255,255,.5);}
.mine-hero .mi .n{font-family:var(--title);font-size:19px;letter-spacing:1px;} .mine-hero .mi .l{font-size:12px;opacity:.85;margin-top:3px;}
.note{font-size:11px;color:var(--ink-3);line-height:1.7;padding:12px 14px;background:var(--paper-2);border-radius:var(--r-sm);border:1px dashed var(--line);margin-top:16px;}
.note b{color:var(--jade-2);}

  if(push!==false && id!==current) history.push(current);
  current=id;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const el=document.getElementById('pg-'+id); el.innerHTML=renderers[id](); el.classList.add('active');
  document.getElementById('scroll').scrollTop=0;
  document.getElementById('abTitle').textContent=(id==='home')?'八诗八景':PAGES[id];
  document.getElementById('abBack').classList.toggle('show',!TABBED[id]);
  document.getElementById('tabbar').style.display=TABBED[id]?'flex':'none';
  document.querySelectorAll('.tabbar .tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===id));
}

 const n=stampedCount();
 let orders=state.orders.map(o=>'<div class="cell"><div class="ci" style="background:var(--rose-soft);color:var(--rose)">📦</div><div class="ct"><div class="a">'+o.name.slice(0,16)+'</div><div class="b">'+o.time+' · 共 '+o.qty+' 件</div></div><div class="cv">¥'+o.amt+'</div></div>').join('')||'<div class="empty" style="padding:20px">暂无订单</div>';
 let poems=state.poems.length?state.poems.slice().reverse().map(p=>'<div class="cell" onclick="openPoem()"><div class="ci">📜</div><div class="ct"><div class="a">'+p.t+'</div><div class="b">'+p.lines.join(' · ').slice(0,26)+'…</div></div><span class="tag gold">诗笺</span></div>').join(''):'<div class="empty" style="padding:20px">还没有作品，去 AIGC 共创写一首 ›</div>';
 return '<div class="mine-hero"><div class="av">约</div><div class="mi" style="flex:1"><div class="n">舍北 · 诗友</div><div class="l">'+state.vip+'</div></div><div style="text-align:right"><div style="font-family:var(--title);font-size:22px;font-weight:700">'+state.points+'</div><div style="font-size:11px;opacity:.85">积分</div></div></div>'+
 '<div class="stat3" style="margin-top:14px"><div class="st"><b>'+n+'</b><span>我的集章</span></div><div class="st"><b>'+state.orders.length+'</b><span>我的订单</span></div><div class="st"><b>'+state.bookings.length+'</b><span>我的预约</span></div></div>'+
 '<div class="sec"><div class="sec-h"><span class="t">我的数字诗笺 / 我的八咏<small>WORKS</small></span><span class="more" onclick="go(\'aigc\')">去创作 ›</span></div><div class="card pad" style="padding:4px 14px">'+poems+'</div></div>'+
 '<div class="sec"><div class="sec-h"><span class="t">我的订单<small>ORDERS</small></span></div><div class="card pad" style="padding:4px 14px">'+orders+'</div></div>'+
 '<div class="sec"><div class="card" style="padding:4px 14px">'+
   mineCell('🎫','我的预约',state.bookings.length+' 条','book')+
   mineCell('🔏','我的集章',n+' / 8 枚','stamp')+
   mineCell('🏅','会员权益','雅集会员 · 兑换/直邮','') +
 '</div></div>'+syncNote();
}
function mineCell(i,a,b,pg){
 var click = pg ? "go('"+pg+"')" : "toast('会员权益：集章兑换、扫码直邮、专属诗笺打印')";
 return '<div class="cell" onclick="'+click+'"><div class="ci">'+i+'</div><div class="ct"><div class="a">'+a+'</div></div><div class="cv">'+b+'</div><div class="arr">›</div></div>';
}
function openPoem(){const p=state.poems[state.poems.length-1];if(!p)return;
 openSheet('我的数字诗笺','<div class="poem-out"><div class="pt">· '+p.t+' ·</div><div class="pl">'+p.lines.join('<br>')+'</div></div>'+
   '<div class="pill-row" style="justify-content:center;margin-top:14px"><button class="btn btn-g btn-sm" onclick="toast(\'🖨️ 已发送打印\')">打印</button><button class="btn btn-gold btn-sm" onclick="toast(\'🔦 已投影至线下诗墙\')">投影诗墙</button></div>');
}

/* ============================================================
   渲染：服务设施
   ============================================================ */
renderers.svc=function(){
 let list=SERVICES.map(s=>'<div class="cell" onclick="toast(\'📍 导航至「'+s.a+'」（演示）\')"><div class="ci" style="font-size:20px;background:var(--water-soft)">'+s.i+'</div>'+
   '<div class="ct"><div class="a">'+s.a+'</div><div class="b">'+s.b+'</div></div><div class="cv">'+s.c+'</div></div>').join('');
 let fest=EVENTS.map(e=>'<div class="li-item" style="border-bottom:1px solid var(--line-2)"><span class="lb" style="color:var(--jade)">'+e.d+'</span><span><b style="font-family:var(--title)">'+e.n+'</b> · '+e.p+'</span></div>').join('');
 return '<div class="sec-h" style="margin-top:8px"><span class="t">服务设施<small>FACILITIES</small></span></div><div class="card pad" style="padding:4px 14px">'+list+'</div>'+
 '<div class="sec"><div class="sec-h"><span class="t">四季市集时间表<small>FESTIVALS</small></span><span class="more" onclick="go(\'cal\')">活动日历 ›</span></div><div class="card pad">'+fest+'</div></div>';
}

/* ============================================================
   渲染：活动日历
   ============================================================ */
renderers.cal=function(){
 let list=EVENTS.map(e=>'<div class="card" style="overflow:hidden;margin-bottom:12px"><div style="height:6px;background:'+EVBG[e.s]+'"></div><div class="pad">'+
   '<div style="display:flex;justify-content:space-between;align-items:center"><div style="font-family:var(--title);font-weight:700;font-size:16px">'+e.n+'</div><span class="tag">'+e.d+'</span></div>'+
   '<div style="font-size:12.5px;color:var(--ink-2);margin-top:6px">📍 '+e.p+'</div>'+
   '<div style="font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.6">'+e.t+'</div>'+
   '<div style="margin-top:10px"><button class="btn btn-g btn-sm" onclick="toast(\'📅 已加入提醒，活动前将通知你\')">🔔 订阅提醒</button></div></div></div>').join('');
 return '<div class="hero" style="margin:6px -16px 0;padding:22px 20px 22px;background:linear-gradient(150deg,#8a6a2f,#B98B3E 55%,#CBA25C)">'+
   '<div class="h-kicker">诗路 · 全年不落幕</div><h1 style="font-size:26px">活动日历</h1><div class="h-sub">四季市集 · 月光夜市 · 八咏诗会</div></div>'+
 '<div class="sec">'+list+'</div>';
}

/* ============================================================
   展区详情 Overlay
   ============================================================ */
function openZone(id){const z=ZONES.find(x=>x.id===id);
 const scenes=z.scenes.map(s=>'<div class="li-item"><span class="lb">◈</span><span>'+s+'</span></div>').join('');
 const exps=z.exps.map(s=>'<div class="exp-item">'+s+'</div>').join('');
 const link=z.link.map(s=>'<li>'+s+'</li>').join('');
 const done=state.stamps[id];
 document.getElementById('ovTitle').textContent=z.kw;
 document.getElementById('ovScroll').innerHTML='<div class="ov-body"><div class="ov-hero" style="background:linear-gradient(150deg,'+z.color+',#00000028)">'+
   '<svg class="bigart">'+ART[z.art].replace(/stroke-linecap="round"/g,'').replace(/opacity="[^"]*"/g,'').replace(/<path /g,'<path fill="#fff" stroke="none" ').replace(/<circle /g,'<circle fill="#fff" stroke="none" ')+'</svg>'+
   '<div class="no">'+z.no+' · '+z.stage+' · '+z.village+'</div><h2>'+z.name.replace('（笼式足球场）','')+'</h2>'+
   '<div class="kw">'+z.kw+' — 《八咏诗·'+z.poem+'》</div><div class="verse">'+z.verse+'</div></div>'+
 '<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><span class="tag">'+z.tag+'</span><span class="tag water">'+z.village+'</span>'+(done?'<span class="tag rose">✓ 已集章</span>':'')+'</div>'+
 '<div class="ov-h">诗意解读</div><div style="font-size:13.5px;color:var(--ink-2);line-height:1.9">'+z.intent+'</div>'+
 '<div class="ov-h">展陈场景</div>'+scenes+
 '<div class="ov-h">体验动线</div>'+exps+
 '<div class="link"><div class="lk-h">🔗 实地联动 · 数字云展</div><ul>'+link+'</ul></div>'+
 '<div class="ov-h">讲解词</div><div style="font-family:var(--title);font-size:14px;color:var(--jade-2);line-height:1.9">'+z.guide+'</div>'+
 syncNote()+'</div>';
 const foot=document.getElementById('ovFoot');
 foot.innerHTML='<button class="btn btn-g" style="flex:1" onclick="closeOverlay();go(\'map\')">在导览中查看</button>'+
   '<button class="btn '+(done?'btn-g':'btn-p')+'" style="flex:1" onclick="ovStamp(\''+id+'\','+ZONES.indexOf(z)+')" '+(done?'disabled style="flex:1;opacity:.6"':'')+'>'+(done?'✓ 已集章':'🔏 扫码盖章')+'</button>';
 foot.style.display='flex';
 document.getElementById('overlay').classList.add('show');
}
function ovStamp(id,i){stampAction(id,i);closeOverlay();}
function closeOverlay(){document.getElementById('overlay').classList.remove('show');document.getElementById('ovFoot').style.display='none';}

/* ============================================================
   时钟 & 启动
   ============================================================ */
function clock(){const d=new Date();let h=d.getHours(),m=('0'+d.getMinutes()).slice(-2);document.getElementById('clock').textContent=h+':'+m;}
clock();setInterval(clock,20000);
document.getElementById('pg-home').innerHTML=renderers.home();
// 预渲染一次以填充其它页
</script>
</body>
</html>
